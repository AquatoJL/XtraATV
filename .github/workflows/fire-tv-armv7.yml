name: Fire TV ARMv7 compatibility

on:
  push:
    branches: [ test/fire-tv-armv7-compatibility ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build release APK
        run: ./gradlew --no-daemon clean assembleRelease

      - name: Verify Android manifest requirements
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          SDK=$(sed -n 's/^[[:space:]]*minSdk = \\([0-9][0-9]*\\)$/\\1/p' app/build.gradle.kts | head -n1)
          echo "Configured minSdk=$SDK"
          test -n "$SDK"
          test "$SDK" -le 30

      - name: Inspect native ABI payload
        shell: bash
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          unzip -Z1 "$APK" > apk-files.txt
          grep -E '^lib/[^/]+/[^/]+\\.so$' apk-files.txt > native-libs.txt || true
          if [ ! -s native-libs.txt ]; then
            echo "No packaged native .so libraries: APK has no native ABI restriction."
            exit 0
          fi
          echo "Native libraries:"
          cat native-libs.txt
          if grep -q '^lib/armeabi-v7a/' native-libs.txt; then
            echo "armeabi-v7a native libraries are present."
          else
            echo "::error::APK contains native libraries but no armeabi-v7a payload. It is not safe to claim compatibility with 32-bit Fire TV devices."
            exit 1
          fi
          if grep -q '^lib/arm64-v8a/' native-libs.txt; then
            echo "arm64-v8a payload is also present."
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: xtratv-firetv-arm-check
          path: app/build/outputs/apk/release/app-release.apk
